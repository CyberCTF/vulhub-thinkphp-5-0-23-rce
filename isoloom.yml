# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# ThinkPHP 5.0.23 Request Method RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's thinkphp/5.0.23-rce, vendored in app/, run from the published image vulhub/thinkphp:5.0.23.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-thinkphp-5-0-23-rce

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.25.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: vulhub/thinkphp:5.0.23

checks:
  - name: the ThinkPHP site answers
    http: http://web/
    wait: 60
  - name: the default page is ThinkPHP 5's
    script: checks/thinkphp.sh
    wait: 30

message: |
  ThinkPHP 5.0.23 answers at {{ machines.web.ports.web.url }}.
  How does the Request class decide which method it is handling?
